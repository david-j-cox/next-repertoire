<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Public+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap');
      .h { font-family: 'Public Sans', Arial, sans-serif; font-weight: 600; font-size: 25px; fill: #14213D; }
      .t { font-family: 'Public Sans', Arial, sans-serif; font-size: 19px; fill: #3C4B63; }
      .eb { font-family: 'IBM Plex Mono', Menlo, monospace; font-weight: 500; font-size: 16px; letter-spacing: 1.5px; fill: #5B6B82; }
      .w { font-family: 'Public Sans', Arial, sans-serif; font-size: 19px; fill: #7A3416; }
      .wh { font-family: 'Public Sans', Arial, sans-serif; font-weight: 600; font-size: 19px; fill: #7A3416; }
      .bh { font-family: 'Public Sans', Arial, sans-serif; font-weight: 600; font-size: 19px; fill: #1F4A80; }
      .n { font-family: 'Public Sans', Arial, sans-serif; font-weight: 600; font-size: 19px; fill: #FFFFFF; }
      .title { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; fill: #14213D; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F5D9E"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A3471F"/>
    </marker>
    <g id="b"><circle r="17" fill="#A3471F"/></g>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <text x="50" y="56" class="title">Example: A Tool That Drafts Monthly Progress Summaries</text>

  <text x="50"   y="104" class="eb">SOURCE</text>
  <text x="440"  y="104" class="eb">MODEL OR TOOL</text>
  <text x="830"  y="104" class="eb">OUTPUT AND REVIEW</text>
  <text x="1220" y="104" class="eb">RECORD OR ACTION</text>

  <!-- sources -->
  <rect x="50" y="120" width="330" height="140" rx="14" fill="#E9EDF4" stroke="#D3DAE5" stroke-width="2"/>
  <text x="70" y="158" class="h">Session Data Export</text>
  <text x="70" y="190" class="t">Targets, trial counts,</text>
  <text x="70" y="214" class="t">prompt levels, client code</text>
  <text x="70" y="244" class="t">Names and birth dates removed</text>

  <rect x="50" y="280" width="330" height="140" rx="14" fill="#F9E8DF" stroke="#A3471F" stroke-width="2.5"/>
  <text x="70" y="318" class="h">BCBA's Typed Notes</text>
  <text x="70" y="350" class="t">Free-text observations,</text>
  <text x="70" y="374" class="t">written with initials</text>

  <!-- vendor -->
  <rect x="440" y="120" width="330" height="300" rx="14" fill="#FFFFFF" stroke="#2F5D9E" stroke-width="3"/>
  <text x="460" y="158" class="h">Approved AI Vendor</text>
  <text x="460" y="194" class="t">Covered by a BAA</text>
  <text x="460" y="226" class="t">Contract says inputs are</text>
  <text x="460" y="250" class="t">not used for training</text>
  <text x="460" y="282" class="t">Contract says inputs are</text>
  <text x="460" y="306" class="t">deleted at 30 days</text>
  <text x="460" y="338" class="t">Model version can change</text>
  <text x="460" y="362" class="t">with vendor updates</text>

  <!-- draft -->
  <rect x="830" y="120" width="330" height="140" rx="14" fill="#F9E8DF" stroke="#A3471F" stroke-width="2.5"/>
  <text x="850" y="158" class="h">Draft Summary</text>
  <text x="850" y="190" class="t">Held in vendor workspace,</text>
  <text x="850" y="214" class="t">set to delete after signature</text>

  <!-- review -->
  <rect x="830" y="280" width="330" height="140" rx="14" fill="#F9E8DF" stroke="#A3471F" stroke-width="2.5"/>
  <text x="850" y="318" class="h">BCBA Review</text>
  <text x="850" y="350" class="t">Checks the draft against</text>
  <text x="850" y="374" class="t">session data, edits, signs</text>

  <!-- EHR -->
  <rect x="1220" y="120" width="330" height="300" rx="14" fill="#F9E8DF" stroke="#A3471F" stroke-width="2.5"/>
  <text x="1240" y="158" class="h">Signed Note in EHR</text>
  <text x="1240" y="190" class="t">Kept under state record-</text>
  <text x="1240" y="214" class="t">retention rules</text>
  <text x="1240" y="256" class="eb">MAY BE SHARED WITH</text>
  <text x="1240" y="290" class="t">Supervisor</text>
  <text x="1240" y="318" class="t">Payer, on request</text>
  <text x="1240" y="346" class="t">Caregiver</text>

  <!-- logs -->
  <rect x="440" y="470" width="330" height="130" rx="14" fill="#F9E8DF" stroke="#A3471F" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="460" y="508" class="h">Vendor Logs</text>
  <text x="460" y="540" class="t">Prompts, outputs, user IDs,</text>
  <text x="460" y="564" class="t">timestamps</text>

  <!-- spot check -->
  <rect x="830" y="470" width="720" height="130" rx="14" fill="#FFFFFF" stroke="#2F5D9E" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="850" y="508" class="h">Monthly Spot Check</text>
  <text x="850" y="540" class="t">A second reviewer compares a sample of signed notes to session data.</text>
  <text x="850" y="564" class="t">Results go back to the BCBA as feedback, and to the team as an error rate.</text>

  <!-- arrows -->
  <line x1="380" y1="190" x2="436" y2="190" stroke="#2F5D9E" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="380" y1="350" x2="436" y2="350" stroke="#2F5D9E" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="770" y1="190" x2="826" y2="190" stroke="#2F5D9E" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="995" y1="260" x2="995" y2="276" stroke="#2F5D9E" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="1160" y1="350" x2="1216" y2="350" stroke="#2F5D9E" stroke-width="3.5" marker-end="url(#ar)"/>
  <line x1="605" y1="420" x2="605" y2="466" stroke="#A3471F" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#arw)"/>
  <line x1="1385" y1="420" x2="1385" y2="466" stroke="#2F5D9E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <line x1="995" y1="470" x2="995" y2="424" stroke="#2F5D9E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/>

  <!-- badges on boxes -->
  <use href="#b" x="380" y="280"/><text x="380" y="287" class="n" text-anchor="middle">1</text>
  <use href="#b" x="770" y="120"/><text x="770" y="127" class="n" text-anchor="middle">2</text>
  <use href="#b" x="1160" y="120"/><text x="1160" y="127" class="n" text-anchor="middle">3</text>
  <use href="#b" x="1160" y="280"/><text x="1160" y="287" class="n" text-anchor="middle">4</text>
  <use href="#b" x="1550" y="120"/><text x="1550" y="127" class="n" text-anchor="middle">5</text>
  <use href="#b" x="770" y="470"/><text x="770" y="477" class="n" text-anchor="middle">6</text>

  <!-- risk notes, two columns -->
  <g transform="translate(50,640)">
    <use href="#b" x="17" y="0"/><text x="17" y="7" class="n" text-anchor="middle">1</text>
    <text x="48" y="7" class="wh">Identifying details can slip through.</text>
    <text x="48" y="32" class="w">Free text may carry names, places, or rare details.</text>

    <use href="#b" x="17" y="78"/><text x="17" y="85" class="n" text-anchor="middle">2</text>
    <text x="48" y="85" class="wh">The model can change.</text>
    <text x="48" y="110" class="w">An update may shift how drafts read, with or without notice.</text>

    <use href="#b" x="17" y="156"/><text x="17" y="163" class="n" text-anchor="middle">3</text>
    <text x="48" y="163" class="wh">The draft may be wrong.</text>
    <text x="48" y="188" class="w">It can add claims the data do not support, or leave out ones they do.</text>
  </g>
  <g transform="translate(830,640)">
    <use href="#b" x="17" y="0"/><text x="17" y="7" class="n" text-anchor="middle">4</text>
    <text x="48" y="7" class="wh">Review can weaken over time.</text>
    <text x="48" y="32" class="w">When drafts usually look right, checks may get shorter (automation bias).</text>

    <use href="#b" x="17" y="78"/><text x="17" y="85" class="n" text-anchor="middle">5</text>
    <text x="48" y="85" class="wh">The output becomes a record.</text>
    <text x="48" y="110" class="w">Once signed, it may travel further than the tool did.</text>

    <use href="#b" x="17" y="156"/><text x="17" y="163" class="n" text-anchor="middle">6</text>
    <text x="48" y="163" class="wh">Logs are an easy copy to forget.</text>
    <text x="48" y="188" class="w">Ask who can see them and when they are purged.</text>
  </g>

  <text x="50" y="884" class="t" style="font-size:16px;fill:#5B6B82">Fictional example for teaching. Not legal advice. Apply your organization's policy.</text>
</svg>
