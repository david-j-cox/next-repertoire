  html += '<div class="footer"><span>David J. Cox &amp; Ryan L. O’Donnell · Project Chiron</span>'
    + '<button class="btn small quiet" id="export-btn">Export my answers</button>'
    + '<button class="btn small quiet" id="print-btn">Print</button>'
    + (wantAdmin ? '<a href="#welcome">Exit facilitator view</a>' : '<a href="#admin">Facilitator</a>')
    + '</div>';
  html += '</main></div>';
  root.innerHTML = html;
  hydrate();
  if(cur!=="welcome" && !ADMIN) lsSet(LS_SEC, cur);
  if(opts.keepScroll){
    window.scrollTo(0,scrollY);
    if(focusId){ var el=document.getElementById(focusId); if(el){ el.focus({preventScroll:true}); try{ if(selS!==null) el.setSelectionRange(selS,selE); }catch(e){} } }
  } else window.scrollTo(0,0);
}

function nowChip(){
  var s = sectionById(GATES.current);
  if(!s) return '';
  return '<a class="now-chip" href="#s/'+s.id+'" title="Current section"><i></i>Now: '+s.code+' '+s.nav+'</a>';
}
function connChip(){
  var t = !API_URL ? 'Preview' : (ONLINE===null ? 'Connecting' : (ONLINE ? 'Live' : 'Offline'));
  var c = !API_URL ? 'prev' : (ONLINE ? 'on' : 'off');
  return '<span class="conn '+c+'" id="conn" title="Connection to the workshop sheet">'+t+'</span>';
}

function renderRail(cur){
  var out = '<a href="#welcome" class="'+(cur==="welcome"?'active':'')+'"><span class="rc">—</span>Welcome</a>';
  var lastBlock = 0;
  SECTIONS.forEach(function(s){
    if(s.block!==lastBlock){
      lastBlock = s.block;
      out += '</div><div class="rail-block"><div class="eyebrow">'+BLOCKS[s.block].n+' · '+BLOCKS[s.block].time+'</div>';
    }
    var open = ADMIN || isUnlocked(s.id);
    var cls = (s.id===cur?'active ':'')+(open?'':'locked');
    var tail = '';
    if(!open) tail = '<span class="lk" title="Opens later in the workshop">locked</span>';
    else if(GATES.current===s.id) tail = '<span class="nowdot" title="Now"></span>';
    if(open) out += '<a href="#s/'+s.id+'" class="'+cls+'"><span class="rc">'+s.code+'</span><span>'+s.nav+'</span>'+tail+'</a>';
    else out += '<a class="'+cls+'" aria-disabled="true"><span class="rc">'+s.code+'</span><span>'+s.nav+'</span>'+tail+'</a>';
  });
  return '<div class="rail-block">'+out+'</div>';
}

function renderLanding(){
  var nowS = sectionById(GATES.current);
  var rows = [1,2,3].map(function(b){
    var secs = SECTIONS.filter(function(s){return s.block===b;});
    var open = secs.filter(function(s){return isUnlocked(s.id);}).length;
    var st = open===0 ? 'Locked' : (open===secs.length ? 'Open' : open+' of '+secs.length+' open');
    return '<tr><td class="k">'+BLOCKS[b].time+'</td><td>'+BLOCKS[b].t+'</td><td>'+st+'</td></tr>';
  }).join('');
  return ''
   + '<div class="hero">'
   + '<div class="eyebrow">SDABA 2026</div>'
   + '<h1>The Next Repertoire</h1>'
   + '<p class="sub">Designing Your Professional Skillset for AI-Augmented Practice</p>'
   + '<div class="meta"><span>David J. Cox</span><span>Ryan L. O’Donnell</span><span>3 hours</span></div>'
   + '</div>'
   + '<div class="section" style="margin-top:20px">'
   + '<p>Same sections as the printed workbook. Use either. Sections open as the workshop reaches them.</p>'
   + '<p>Your answers are saved in this browser. Some prompts have a Submit button; those responses go to the facilitators anonymously. Use fictional examples; no client or staff information.</p>'
   + twrap(thead(["Time","Block","Status"])+'<tbody>'+rows+'</tbody>')
   + (nowS ? '<p><a class="btn primary" href="#s/'+nowS.id+'">Current section: '+nowS.code+' '+nowS.nav+'</a></p>' : '<p><a class="btn primary" href="#s/orient">Start: 01 Orient</a></p>')
   + '</div>';
}

function renderSection(id){
  var s = sectionById(id);
  if(!s) return renderLanding();
  var idx = SECTIONS.indexOf(s);
  if(!ADMIN && !isUnlocked(id)){
    return '<div class="locked-note"><div class="eyebrow">'+s.code+' · '+BLOCKS[s.block].n+'</div><h2>'+s.title+'</h2><p>Not open yet.</p><p><a class="btn" href="#welcome">Back</a></p></div>';
  }
  CUR_SECTION = s.code+" "+s.title;
  var prev = lastUnlockedBefore(idx), next = firstUnlockedAfter(idx);
  var nextLocked = (!next && idx<SECTIONS.length-1) ? SECTIONS[idx+1] : null;
  var chip = ADMIN ? '<span class="lockchip'+(isUnlocked(id)?' open':'')+'">'+(isUnlocked(id)?'Open to participants':'Locked for participants')+'</span>' : '';
  return '<article class="section">'
   + '<div class="section-head"><span class="code">'+s.code+' · '+BLOCKS[s.block].n+'</span>'+(GATES.current===id?'<span class="who rec" style="margin:0">Now</span>':'')+chip+'</div>'
   + '<h2>'+s.title+'</h2>'
   + (s.lede?'<p class="lede">'+s.lede+'</p>':'')
   + s.html()
   + '</article>'
   + '<div class="pager">'
   + (prev ? '<a href="#s/'+prev.id+'"><small>Previous</small>'+prev.code+' · '+prev.nav+'</a>' : '<a href="#welcome"><small>Previous</small>Welcome</a>')
   + (next ? '<a class="next" href="#s/'+next.id+'"><small>Next</small>'+next.code+' · '+next.nav+'</a>' : (nextLocked ? '<a class="next disabled"><small>Next (locked)</small>'+nextLocked.code+' · '+nextLocked.nav+'</a>' : ''))
   + '</div>';
}

/* ---------- submissions ---------- */
function subKey(form,stage){ return form+(stage?":"+stage:""); }
function formBlock(form,fields,opts){
  opts = opts||{};
  var st = SUBMITTED[subKey(form,opts.stage)];
  var note = opts.note || "Anonymous. Goes to the facilitators.";
  return '<div class="submit" data-form="'+form+'" data-stage="'+(opts.stage||'')+'" data-fields="'+fields.join(',')+'">'
   + '<button class="btn primary small" type="button">'+(st?'Submit again':'Submit')+'</button>'
   + '<span class="submit-status">'+(st ? 'Submitted '+fmtTime(st)+'.' : note)+'</span></div>';
}
function submitBlock(box){
  var form = box.getAttribute("data-form"), stage = box.getAttribute("data-stage")||"";
  var ids = box.getAttribute("data-fields").split(",");
  var status = box.querySelector(".submit-status"), btn = box.querySelector("button");
  if(!API_URL){ status.textContent = "Not connected to the response sheet yet."; return; }
  var data = {}; var any=false;
  ids.forEach(function(id){ var el=document.getElementById(id); var v = el ? (el.type==="checkbox"?el.checked:el.value) : ANSWERS[id]; if(v===undefined) v=""; data[id]=v; if(v!=="" && v!==false) any=true; });
  if(!any){ status.textContent = "Nothing to send yet."; return; }
  if(stage) data.stage = stage;
  btn.disabled = true; status.textContent = "Sending…";
  apiPost({action:"submit", form:form, pid:PID, table:myTable(), data:data}).then(function(r){
    if(r && r.ok){ var now=new Date().toISOString(); SUBMITTED[subKey(form,stage)]=now; lsSet(LS_SUB, JSON.stringify(SUBMITTED)); status.textContent="Submitted "+fmtTime(now)+"."; btn.textContent="Submit again"; setTimeout(pollSummary, 1500); }
    else status.textContent = "Could not send ("+((r&&r.error)||"unknown")+"). Try again.";
  }).catch(function(){ status.textContent = "Could not send. Check the connection and try again."; })
  .then(function(){ btn.disabled=false; });
}

/* ---------- facilitator ---------- */
function renderLogin(){
  return '<section class="admin"><h2>Facilitator</h2>'
   + (API_URL ? '<div class="field" style="max-width:320px"><label for="admin-key">Passcode</label><input type="password" id="admin-key" autocomplete="current-password"></div><button class="btn primary" id="admin-login">Enter</button>'
              + (ADMIN_MSG ? '<div class="msg err">'+ADMIN_MSG+'</div>' : '')
              : '<p>Preview mode. Set API_URL in the page to enable facilitator controls.</p>')
   + '</section>';
}
function adminLogin(){
  var key = (document.getElementById("admin-key")||{}).value || "";
  var btn = document.getElementById("admin-login"); if(btn){ btn.disabled=true; btn.textContent="Checking…"; }
  apiGet({action:"admin", key:key}).then(function(r){
    if(r && !r.error){ ADMIN=true; ADMIN_KEY=key; ssSet(SS_KEY,key); ADMIN_DATA=r; ADMIN_MSG=null; if(r.gates) applyGates(r.gates); render(); }
    else { ADMIN_MSG = "Passcode not accepted."; render(); }
  }).catch(function(){ ADMIN_MSG="Could not reach the sheet. Try again."; render(); });
}
function refreshAdmin(){
  if(!ADMIN || !API_URL) return;
  apiGet({action:"admin", key:ADMIN_KEY}).then(function(r){
    if(r && !r.error){ ADMIN_DATA=r; if(r.gates) applyGates(r.gates); var box=document.getElementById("responses"); if(box) box.innerHTML=renderResponses(); var t=document.getElementById("resp-time"); if(t) t.textContent="Updated "+fmtTime(new Date().toISOString()); }
    else if(r && r.error==="unauthorized"){ ADMIN=false; ssSet(SS_KEY,null); ADMIN_MSG="Session ended. Enter the passcode again."; render(); }
  }).catch(function(){});
}
function renderAdmin(){
  var g = PENDING || GATES;
  if(PENDING) PENDING.unlocked = orderUnlocked(PENDING.unlocked);
  if(PENDING) PENDING.show = ALL_PANELS.filter(function(k){return PENDING.show.indexOf(k)>=0;});
  var dirty = !!PENDING && JSON.stringify(PENDING)!==JSON.stringify(GATES);
  var openCount = g.unlocked.length;
  var nowS = sectionById(g.current);
  var lastBlock = 0, gates = '';
  SECTIONS.forEach(function(s){
    if(s.block!==lastBlock){ lastBlock=s.block; gates += '<div class="gate-block eyebrow">'+BLOCKS[s.block].n+' · '+BLOCKS[s.block].t+'</div>'; }
    var on = g.unlocked.indexOf(s.id)>=0;
    gates += '<div class="gate"><label class="sw"><input type="checkbox" data-gate="'+s.id+'"'+(on?' checked':'')+' aria-label="Open '+s.code+' '+s.nav+' to participants"><i></i></label>'
      + '<span><span class="rc">'+s.code+'</span>'+s.nav+'</span>'
      + '<button class="nowbtn'+(g.current===s.id?' on':'')+'" data-now="'+s.id+'" title="Mark as current">Now</button></div>';
  });
  return '<section class="admin" id="admin-panel">'
   + '<div class="admin-head"><h2>Sections</h2><span class="status">Participants see <strong>'+openCount+'</strong> of '+SECTIONS.length+'. Now: <strong>'+(nowS?nowS.code+' '+nowS.nav:'Welcome')+'</strong>.</span></div>'
   + '<div class="actions">'
   + '<button class="btn" id="a-next">Open next</button>'
   + '<button class="btn" id="a-all">Open all</button>'
   + '<button class="btn" id="a-block1">Block 1 only</button>'
   + '<button class="btn" id="a-lock">Lock all</button>'
   + '<span style="flex:1"></span>'
   + (dirty ? '<span class="pending">Unpublished changes</span><button class="btn" id="a-discard">Discard</button>' : '')
   + '<button class="btn primary" id="a-publish"'+(dirty?'':' disabled')+'>Publish</button>'
   + '</div>'
   + '<div class="gates">'+gates+'</div>'
   + '<h3>Room results shown to participants</h3>'
   + '<div class="gates">'+PANELS.map(function(p){ var on=g.show.indexOf(p[0])>=0; return '<div class="gate"><label class="sw"><input type="checkbox" data-show="'+p[0]+'"'+(on?' checked':'')+' aria-label="Show '+p[1]+'"><i></i></label><span>'+p[1]+'</span><span></span></div>'; }).join('')+'</div>'
   + '<div id="admin-msg" hidden></div>'
   + '</section>'
   + '<section class="admin" id="admin-responses">'
   + '<div class="admin-head"><h2>Responses</h2><span class="status" id="resp-time"></span><span style="flex:1"></span><button class="btn small" id="a-refresh">Refresh</button><button class="btn small quiet" id="a-logout">Sign out</button></div>'
   + '<div id="responses">'+renderResponses()+'</div>'
   + '</section>';
}
function draft(){ if(!PENDING) PENDING = JSON.parse(JSON.stringify(GATES)); return PENDING; }
function setGate(id,on){
  var g = draft(); var i = g.unlocked.indexOf(id);
  if(on && i<0) g.unlocked.push(id);
  if(!on && i>=0) g.unlocked.splice(i,1);
  if(!on && g.current===id) g.current = "welcome";
  render({keepScroll:true});
}
function adminMsg(text,err){ var m=document.getElementById("admin-msg"); if(!m) return; m.hidden=false; m.className="msg"+(err?" err":""); m.textContent=text; }
function publishGates(){
  var g = PENDING; if(!g) return;
  var btn = document.getElementById("a-publish"); if(btn){ btn.disabled=true; btn.textContent="Publishing…"; }
  apiPost({action:"setGates", key:ADMIN_KEY, gates:{unlocked:orderUnlocked(g.unlocked), current:g.current, show:g.show}}).then(function(r){
    if(r && r.ok){ PENDING=null; applyGates(r.gates); render({keepScroll:true}); adminMsg("Published. Participants update within about "+Math.round(POLL_MS/1000)+" seconds."); }
    else { adminMsg("Publish failed ("+((r&&r.error)||"unknown")+")."); if(btn){btn.disabled=false;btn.textContent="Publish";} }
  }).catch(function(){ adminMsg("Publish failed. Check the connection and try again.", true); if(btn){btn.disabled=false;btn.textContent="Publish";} });
}

/* ---------- live panels (participant-facing aggregates) ---------- */
var SUMMARY = null, summaryTimer = null;
var STAGES = {
  problem:{title:"Problem statements (04)",text:function(r){ return 'In '+r["f04-ctx"]+', AI may '+r["f04-action"]+' to support '+r["f04-purpose"]+'. '+r["f04-role"]+' retains responsibility for '+r["f04-decision"]+'.'; }},
  define:{title:"Define statements (05A)",text:function(r){ return r["f05a-person"]+' needs '+r["f05a-need"]+' because '+r["f05a-insight"]+'. How might we '+r["f05a-hmw"]+(r["f05a-revised"]?' Revised: '+r["f05a-revised"]:''); }},
  selected:{title:"Selected options (11A)",text:function(r){ return r["f11b-selected"]+(r["f11b-assumption"]?' Assumption: '+r["f11b-assumption"]:''); }},
  fieldlab:{title:"Field Lab reports (13A)",text:function(r){ return 'Our purpose is '+r["f13a-r1"]+' | AI may '+r["f13a-r2"]+' | A human must '+r["f13a-r3"]+' | We will measure '+r["f13a-r4"]+' | We stop or escalate when '+r["f13a-r5"]; }}
};
var OBJS = [["c1","Differentiate AI types"],["c2","Analyze a workflow with the canvas"],["c3","Evaluate governance considerations"],["c4","Produce a 30-day prototype"]];
function livePanel(kind){
  if(!ADMIN && GATES.show.indexOf(kind)<0) return '';
  return '<div class="live" data-live="'+kind+'"><div class="live-head"><span class="eyebrow">Room results</span><span class="code live-time"></span></div><div class="live-body">'+(API_URL?'Loading…':'Results appear here once the site is connected.')+'</div></div>';
}
function renderReports(rows,stage){
  var st = STAGES[stage]; var rs = (rows||[]).filter(function(r){return r.stage===stage;});
  if(!rs.length) return '<p class="code">No tables have submitted yet.</p>';
  var lp = latestPerTable(rs);
  return twrap('<tbody>'+Object.keys(lp).sort().map(function(t){ return '<tr><td class="k">Table '+esc(t||"?")+'</td><td>'+esc(st.text(lp[t]))+'</td></tr>'; }).join('')+'</tbody>');
}
function renderConfidence(pre,post,prefix){
  prefix = prefix||"";
  if(!pre.length && !post.length) return '<p class="code">No responses yet.</p>';
  return twrap(thead(["Confidence, 1–5","Pre (n="+pre.length+")","Post (n="+post.length+")"])+'<tbody>'+OBJS.map(function(o){ return '<tr><td class="k">'+o[1]+'</td><td>'+mean(pre,prefix?"fpre-"+o[0]:o[0])+'</td><td>'+mean(post,prefix?"fpost-"+o[0]:o[0])+'</td></tr>'; }).join('')+'</tbody>');
}
function renderInterests(rows){
  if(!rows.length) return '<p class="code">No responses yet.</p>';
  var first=count(rows,"first"), second=count(rows,"second");
  return twrap(thead(["Table","First choice","Second choice"])+'<tbody>'+TABLES.map(function(t){ return '<tr><td class="k">'+t.id+' · '+t.name+'</td><td>'+(first[t.id]||0)+'</td><td>'+(second[t.id]||0)+'</td></tr>'; }).join('')+'</tbody>')
    + kvTable("Expected role", count(rows,"role"));
}
function renderDemographics(rows){
  if(!rows.length) return '<p class="code">No responses yet.</p>';
  return '<div class="cards">'+[["role","Role"],["setting","Setting"],["years","Years in field"],["org","Organization size"],["ai","Current AI use"]].map(function(f){ return '<div class="card">'+kvTable(f[1],count(rows,f[0]))+'</div>'; }).join('')+'</div>';
}
function paintLive(){
  var panels = root.querySelectorAll(".live"); if(!panels.length || !SUMMARY) return;
  var when = fmtTime(new Date().toISOString());
  panels.forEach(function(p){
    var kind = p.getAttribute("data-live"), body = p.querySelector(".live-body"), html='';
    if(kind==="interests") html = renderInterests(SUMMARY.interests||[]);
    else if(kind==="demographics") html = renderDemographics(SUMMARY.demographics||[]);
    else if(kind==="confidence") html = renderConfidence(SUMMARY.pre||[], SUMMARY.post||[]);
    else if(kind.indexOf("reports:")===0) html = renderReports(SUMMARY.table_reports||[], kind.slice(8));
    body.innerHTML = html; p.querySelector(".live-time").textContent = "Updated "+when;
  });
}
function pollSummary(){
  clearTimeout(summaryTimer);
  if(!API_URL || !root.querySelector(".live")) return;
  apiGet({action:"summary"}).then(function(r){ if(r && !r.error){ SUMMARY=r; paintLive(); } }).catch(function(){})
    .then(function(){ summaryTimer = setTimeout(pollSummary, 15000); });
}

/* response summaries */
function count(rows,field){ var m={}; rows.forEach(function(r){ var v=(r[field]===undefined||r[field]==="")?"(blank)":String(r[field]); m[v]=(m[v]||0)+1; }); return m; }
function mean(rows,field){ var n=0,s=0; rows.forEach(function(r){ var v=parseFloat(r[field]); if(!isNaN(v)){ n++; s+=v; } }); return n?(s/n).toFixed(1):"–"; }
function latestPerTable(rows){ var m={}; rows.forEach(function(r){ var t=r.table||"?"; m[t]=r; }); return m; }
function kvTable(title,m){ var keys=Object.keys(m).sort(function(a,b){return m[b]-m[a];}); if(!keys.length) return ''; return '<h4>'+title+'</h4>'+twrap('<tbody>'+keys.map(function(k){return '<tr><td>'+esc(k)+'</td><td class="k">'+m[k]+'</td></tr>';}).join('')+'</tbody>'); }
function renderResponses(){
  var d = ADMIN_DATA;
  if(!d) return '<p class="code">No data loaded yet.</p>';
  var c = d.counts||{}, R = d.rows||{};
  var out = '<div class="cards">'+["pre","demographics","quadrant","interests","table_reports","commit","post"].map(function(f){ return '<div class="card"><div class="eyebrow">'+f.replace("_"," ")+'</div><h4 style="font-size:1.4rem">'+(c[f]||0)+'</h4></div>'; }).join('')+'</div>';

  /* interests: for table sorting */
  var ir = latestPerTable ? (function(){ var m={}; (R.interests||[]).forEach(function(r){ m[r.pid||Math.random()]=r; }); return Object.keys(m).map(function(k){ var r=m[k]; return {first:r["fint-first"],second:r["fint-second"],role:r["fint-role"]}; }); })() : [];
  if(ir.length) out += '<h3>Interest poll ('+ir.length+' people, latest response each)</h3>'+renderInterests(ir);

  /* table reports */
  var tr = R.table_reports||[];
  Object.keys(STAGES).forEach(function(stage){ if(tr.some(function(r){return r.stage===stage;})) out += '<h3>'+STAGES[stage].title+'</h3>'+renderReports(tr,stage); });

  /* pre / post */
  var pre = R.pre||[], post = R.post||[];
  if(pre.length||post.length) out += '<h3>Confidence</h3>'+renderConfidence(pre,post,true);

  /* demographics */
  var dm = (R.demographics||[]).map(function(r){ return {role:r["fdem-role"],setting:r["fdem-setting"],years:r["fdem-years"],org:r["fdem-org"],ai:r["fdem-ai"]}; });
  if(dm.length) out += '<h3>Role and setting snapshot (n='+dm.length+')</h3>'+renderDemographics(dm);
  return out;
}

/* ---------- export ---------- */
function exportAnswers(){
  var lines = ["# The Next Repertoire: my workbook answers","", "Exported "+new Date().toLocaleString(),""];
  var t = myTable(); if(t) lines.push("Table "+t,"");
  var lastSec = "", all = [];
  var saveFields = FIELDS, saveCur = CUR_SECTION;
  SECTIONS.forEach(function(s){ FIELDS=[]; CUR_SECTION=s.code+" "+s.title; s.html(); all = all.concat(FIELDS); });
  FIELDS = saveFields; CUR_SECTION = saveCur;
  var n = 0;
  all.forEach(function(f){
    var v = ANSWERS[f.id];
    if(v===undefined || v==="" || v===false) return;
    if(f.section!==lastSec){ lines.push("", "## "+f.section, ""); lastSec=f.section; }
    var label = f.label.replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
    if(v===true) lines.push("- [x] "+label.replace(/^\[ \] /,""));
    else lines.push("**"+label+"**", "", String(v), "");
    n++;
  });
  if(!n){ toast("Nothing to export yet."); return; }
  var blob = new Blob([lines.join("\n")], {type:"text/markdown"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "next-repertoire-answers.md";
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
var toastTimer=null;
function toast(msg){
  var t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; clearTimeout(toastTimer); toastTimer=setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },3200);
}

/* ---------- hydrate ---------- */
function hydrate(){
  root.querySelectorAll("input[type=text],textarea,select").forEach(function(el){ if(el.id && ANSWERS[el.id]!==undefined) el.value = ANSWERS[el.id]; });
  root.querySelectorAll("input[type=checkbox]").forEach(function(el){ if(el.id && ANSWERS[el.id]!==undefined) el.checked = !!ANSWERS[el.id]; });
  renderTableCard();
  var q=function(id){return document.getElementById(id);};
  if(q("menu-btn")) q("menu-btn").onclick=function(){ railOpen=!railOpen; q("rail").classList.toggle("open",railOpen); q("menu-btn").setAttribute("aria-expanded",railOpen); };
  if(q("export-btn")) q("export-btn").onclick=exportAnswers;
  if(q("print-btn")) q("print-btn").onclick=function(){ window.print(); };
  root.querySelectorAll(".submit button").forEach(function(b){ b.onclick=function(){ submitBlock(b.parentNode); }; });
  paintLive(); pollSummary();
  if(q("admin-login")) { q("admin-login").onclick=adminLogin; q("admin-key").onkeydown=function(e){ if(e.key==="Enter") adminLogin(); }; }
  if(ADMIN){
    root.querySelectorAll("[data-gate]").forEach(function(el){ el.onchange=function(){ setGate(el.getAttribute("data-gate"), el.checked); }; });
    root.querySelectorAll("[data-show]").forEach(function(el){ el.onchange=function(){ var g=draft(); var k=el.getAttribute("data-show"); var i=g.show.indexOf(k); if(el.checked&&i<0) g.show.push(k); if(!el.checked&&i>=0) g.show.splice(i,1); render({keepScroll:true}); }; });
    root.querySelectorAll("[data-now]").forEach(function(el){ el.onclick=function(){ var g=draft(); var id=el.getAttribute("data-now"); g.current = (g.current===id) ? "welcome" : id; if(g.current!=="welcome" && g.unlocked.indexOf(id)<0) g.unlocked.push(id); render({keepScroll:true}); }; });
    if(q("a-next")) q("a-next").onclick=function(){ var g=draft(); for(var i=0;i<SECTIONS.length;i++){ if(g.unlocked.indexOf(SECTIONS[i].id)<0){ g.unlocked.push(SECTIONS[i].id); g.current=SECTIONS[i].id; break; } } render({keepScroll:true}); };
    if(q("a-all")) q("a-all").onclick=function(){ var g=draft(); g.unlocked=ALL_IDS.slice(); render({keepScroll:true}); };
    if(q("a-block1")) q("a-block1").onclick=function(){ var g=draft(); g.unlocked=SECTIONS.filter(function(s){return s.block===1;}).map(function(s){return s.id;}); if(g.unlocked.indexOf(g.current)<0) g.current="orient"; render({keepScroll:true}); };
    if(q("a-lock")) q("a-lock").onclick=function(){ var g=draft(); g.unlocked=[]; g.current="welcome"; g.show=[]; render({keepScroll:true}); };
    if(q("a-discard")) q("a-discard").onclick=function(){ PENDING=null; render({keepScroll:true}); };
    if(q("a-publish")) q("a-publish").onclick=publishGates;
    if(q("a-refresh")) q("a-refresh").onclick=refreshAdmin;
    if(q("a-logout")) q("a-logout").onclick=function(){ ADMIN=false; ADMIN_KEY=""; ssSet(SS_KEY,null); ADMIN_DATA=null; PENDING=null; location.hash="#welcome"; };
  }
}
function renderTableCard(){
  var sel = document.getElementById("f04-table"), box = document.getElementById("table-card");
  if(!sel || !box) return;
  var t = TABLES.filter(function(x){return x.id===sel.value;})[0];
  box.innerHTML = t ? '<div class="card" style="margin:.5rem 0 1rem"><h4>Table '+t.id+' · '+t.name+'</h4>'+tableCard(t)+'</div>' : '';
}

root.addEventListener("input", function(e){ var el=e.target; if(!el.id || el.id==="admin-key") return; saveAnswer(el.id, el.type==="checkbox"?el.checked:el.value); });
root.addEventListener("change", function(e){ var el=e.target; if(!el.id || el.id==="admin-key") return; saveAnswer(el.id, el.type==="checkbox"?el.checked:el.value); if(el.id==="f04-table") renderTableCard(); });
window.addEventListener("hashchange", function(){ railOpen=false; if(location.hash!=="#admin") PENDING=null; render(); });
document.addEventListener("visibilitychange", function(){ if(!document.hidden && API_URL) apiGet({action:"state"}).then(function(r){ if(r&&r.gates) applyGates(r.gates); }).catch(function(){}); });

/* boot */
render();
if(API_URL){
  pollGates();
  if(ADMIN_KEY && location.hash==="#admin"){ apiGet({action:"admin",key:ADMIN_KEY}).then(function(r){ if(r&&!r.error){ ADMIN=true; ADMIN_DATA=r; if(r.gates) applyGates(r.gates); render(); } else { ADMIN_KEY=""; ssSet(SS_KEY,null); } }).catch(function(){}); }
  setInterval(function(){ if(ADMIN && location.hash==="#admin") refreshAdmin(); }, 20000);
}

})();
</script>
